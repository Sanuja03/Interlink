# Basic Connection Settings
spring.application.name=INTERLINK

#spring.datasource.url=jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:6543/postgres?prepareThreshold=0
spring.datasource.url=jdbc:postgresql://aws-1-ap-southeast-1.pooler.supabase.com:5432/postgres?prepareThreshold=0
spring.datasource.username=postgres.zyvhemluugmpciqnpygo
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP pool ? keep small for Supabase free tier
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=60000

# JPA / Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

openai.api.key=${OPENAPI_KEY}

server.port=8080
spring.main.allow-bean-definition-overriding=true
spring.security.oauth2.resourceserver.jwt.jws-algorithms=ES256

supabase.service.key=${SERVICE_KEY:}
supabase.url=https://zyvhemluugmpciqnpygo.supabase.co

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://zyvhemluugmpciqnpygo.supabase.co/auth/v1/.well-known/jwks.json